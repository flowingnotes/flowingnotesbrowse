<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FlowingNotes</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 23c5.5 0 5.5-7 11-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='11' r='2.6' fill='white'/%3E%3C/svg%3E" sizes="32x32">
		<style>
			:root,
			[data-theme="light"] {
				--bg: #f5f6f8;
				--surface: #ffffff;
				--surface-2: #f0f1f4;
				--border: #e3e5ea;
				--border-strong: #d3d6dd;
				--text: #171a21;
				--text-muted: #5c6470;
				--text-faint: #9aa1ac;
				--accent: #4f46e5;
				--accent-hover: #4338ca;
				--accent-soft: #edeffe;
				--shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
				--shadow-md: 0 4px 12px rgba(16, 24, 40, .08);
				--danger: #d92d20;
				--danger-soft: #fef1f0;
				--transition: 160ms cubic-bezier(.16, 1, .3, 1);
			}
			[data-theme="dark"] {
				--bg: #0f1115;
				--surface: #171a20;
				--surface-2: #1d212a;
				--border: #2a2f39;
				--border-strong: #3a4150;
				--text: #e7e9ee;
				--text-muted: #a3aab5;
				--text-faint: #6b7280;
				--accent: #6366f1;
				--accent-hover: #818cf8;
				--accent-soft: #23253a;
				--shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
				--shadow-md: 0 4px 12px rgba(0, 0, 0, .4);
				--danger: #f97066;
				--danger-soft: #2a1a19;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				flex-direction: column;
				background: var(--bg);
				color: var(--text);
				font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.topbar {
				display: flex;
				align-items: center;
				gap: 12px;
				height: 60px;
				flex: none;
				padding: 0 24px;
				background: var(--surface);
				border-bottom: 1px solid var(--border);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				color: var(--text);
				font-size: 17px;
				font-weight: 700;
				letter-spacing: -.01em;
			}
			.page-title {
				flex: 1;
				font-size: 16px;
				font-weight: 600;
				letter-spacing: -.01em;
				color: var(--text-muted);
			}
			.topbar-actions {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.icon-btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 36px;
				height: 36px;
				border: 0;
				border-radius: 8px;
				background: transparent;
				color: var(--text-muted);
				cursor: pointer;
				transition: background var(--transition), color var(--transition);
			}
			.icon-btn:hover {
				background: var(--surface-2);
				color: var(--text);
			}
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				padding: 8px 16px;
				border: 1px solid transparent;
				border-radius: 8px;
				font: 600 14px/1.4 inherit;
				color: #fff;
				background: var(--accent);
				cursor: pointer;
				white-space: nowrap;
				transition: background var(--transition);
			}
			.btn:hover {
				background: var(--accent-hover);
			}
			main {
				flex: 1;
				min-height: 0;
				display: flex;
				justify-content: center;
				padding: 28px 24px;
			}
			.note-card {
				width: 100%;
				max-width: 860px;
				display: flex;
				flex-direction: column;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 10px;
				box-shadow: var(--shadow-sm);
				overflow: hidden;
			}
			.note-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 16px 20px;
				border-bottom: 1px solid var(--border);
			}
			.note-title {
				font-size: 15px;
				font-weight: 600;
			}
			.save-state {
				font-size: 12px;
				color: var(--text-faint);
			}
			#note {
				display: block;
				width: 100%;
				flex: 1;
				min-height: 280px;
				border: 0;
				resize: none;
				outline: none;
				padding: 20px;
				background: var(--surface);
				color: var(--text);
				font: 15px/1.7 inherit;
			}
			#note::placeholder {
				color: var(--text-faint);
			}
			.note-foot {
				padding: 12px 20px;
				border-top: 1px solid var(--border);
				font-size: 13px;
				color: var(--text-muted);
			}
			@media (max-width: 640px) {
				.topbar {
					padding: 0 16px;
				}
				main {
					padding: 16px;
				}
				.btn span {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<header class="topbar">
			<div class="brand">
				<svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 23c5.5 0 5.5-7 11-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="22" cy="11" r="2.6" fill="#fff"/></svg>
				FlowingNotes
			</div>
			<div class="page-title">Notes</div>
			<div class="topbar-actions">
				<button id="theme" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
					<svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
				</button>
				<button id="status" class="btn" type="button" title="Open the browser">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
					<span>Open browser</span>
				</button>
			</div>
		</header>
		<main>
			<div class="note-card">
				<div class="note-head">
					<div class="note-title">Quick note</div>
					<div class="save-state" id="saveState">Saved</div>
				</div>
				<textarea id="note" placeholder="Write something…" aria-label="Notepad"></textarea>
				<div class="note-foot">Notes are saved automatically in this browser and stay available after you close it.</div>
			</div>
		</main>
		<script>
			"use strict";
			(function () {
				var note = document.getElementById("note");
				var KEY = "notepad-content";
				var saveTimer = null;

				// Load the previously saved note.
				note.value = localStorage.getItem(KEY) || "";

				// Save automatically as the user types (debounced).
				note.addEventListener("input", function () {
					var state = document.getElementById("saveState");
					if (state) state.textContent = "Saving…";
					clearTimeout(saveTimer);
					saveTimer = setTimeout(function () {
						localStorage.setItem(KEY, note.value);
						if (state) state.textContent = "Saved";
					}, 150);
				});

				// Save immediately when the page is left or refreshed.
				window.addEventListener("beforeunload", function () {
					clearTimeout(saveTimer);
					localStorage.setItem(KEY, note.value);
				});

				document.getElementById("status").addEventListener("click", function () {
					location.href = "relay.html";
				});

				// Theme: follows FlowingNotes' saved preference when present.
				var THEME_KEY = "fn.theme";
				var saved = null;
				try {
					saved = JSON.parse(localStorage.getItem("fn.settings") || "null");
				} catch (e) {}
				var theme = saved && saved.theme ? saved.theme : localStorage.getItem(THEME_KEY) || "light";
				var icon = document.getElementById("theme-icon");
				function applyTheme(t) {
					document.documentElement.setAttribute("data-theme", t);
					icon.innerHTML =
						t === "dark"
							? '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>'
							: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
					localStorage.setItem(THEME_KEY, t);
				}
				applyTheme(theme);
				document.getElementById("theme").addEventListener("click", function () {
					applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
				});
			})();
		</script>
	</body>
</html>
